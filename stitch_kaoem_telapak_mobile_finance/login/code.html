<!-- Brand Accent Header Line -->
<div class="h-2 w-full bg-primary flex">
<div class="h-full w-1/3 bg-secondary-container"></div>
<div class="h-full w-1/3 bg-primary-container"></div>
<div class="h-full w-1/3 bg-tertiary-container"></div>
</div>
<div class="flex-1 flex flex-col items-center justify-center p-gutter max-w-md mx-auto w-full relative z-10">
<!-- Logo Section -->
<div class="mb-stack-gap w-full flex justify-center">
<img alt="Kaoem Telapak Logo" class="h-24 w-auto object-contain drop-shadow-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAUbcj1QUEAuzmv5dcWl-XwFZYpyq0ngvQUe01VsWGkLI0czo4kcqG1XM_qXzkOfTpXmNh7AVRE9l0A8AMCEJL-kn-EIpDN2ekWzHdofcZAieNoP1yEhgcv95clA6UM69dIsUgEN8Ou53OOtwYGNo588q4r7Vt4277sVhu6JlpbNfS1mU3cBdkOZlfNNPPmLQ_o2HND1gzPHqLUKHazdY7v-fcBrUouIRLK6pt9PeNUYemDUMK1ChREqNZ-i5HxpFsQnA"/>
</div>
<!-- Typography Header -->
<div class="text-center mb-margin-desktop w-full">
<h1 class="font-page-title-mobile text-page-title-mobile text-on-surface mb-stack-gap tracking-tight">
                KAOEM TELAPAK<br/>
<span class="text-primary font-medium">Eco Finance System</span>
</h1>
<p class="font-body-main text-body-main text-on-surface-variant max-w-[280px] mx-auto">
                Integrated Financial Management &amp; Expense Approval
            </p>
</div>
<!-- Login Form Container -->
<div class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-component-gap shadow-sm">
<form class="flex flex-col gap-component-gap" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-stack-gap">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">mail</span>
<input class="w-full h-12 pl-10 pr-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-input-text text-input-text focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline-variant/60" id="email" placeholder="user@kaoemtelapak.org" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-stack-gap">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">lock</span>
<input class="w-full h-12 pl-10 pr-12 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-input-text text-input-text focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline-variant/60" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface-variant transition-colors flex items-center justify-center p-1" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibility-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-stack-gap mt-1 mb-2">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary accent-primary cursor-pointer" id="remember" type="checkbox"/>
<label class="font-body-main text-body-main text-on-surface-variant cursor-pointer select-none" for="remember">Remember Me</label>
</div>
<!-- Submit Button -->
<button class="w-full h-12 bg-primary hover:bg-primary-container text-on-primary font-button-text text-button-text rounded-lg flex items-center justify-center gap-2 transition-all active:scale-[0.98] shadow-sm" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Decorative Bottom Element -->
<div class="mt-margin-desktop w-full flex justify-center opacity-40">
<svg fill="none" height="40" viewbox="0 0 120 40" width="120" xmlns="http://www.w3.org/2000/svg">

<circle class="fill-tertiary-container" cx="110" cy="20" r="2"></circle>
</svg>
</div>
</div>
<!-- Language Selector Bottom Bar -->
<div class="mt-auto border-t border-outline-variant bg-surface-container-lowest p-4 flex justify-center items-center gap-4 text-on-surface-variant">
<button class="font-label-md text-label-md hover:text-primary transition-colors flex items-center gap-1 group">
<span class="material-symbols-outlined text-[16px] group-hover:text-primary transition-colors">language</span>
            English (US)
        </button>
<div class="w-[1px] h-4 bg-outline-variant"></div>
<button class="font-label-md text-label-md hover:text-primary transition-colors">
            Bahasa Indonesia
        </button>
</div>
<script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('visibility-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }
    </script>
</div></main></body></html>
