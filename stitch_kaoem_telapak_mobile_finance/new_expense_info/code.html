<div class="px-margin-mobile pt-6 pb-4">
<div class="flex items-center justify-between mb-4">
<div class="flex flex-col gap-1">
<h2 class="font-page-title-mobile text-page-title-mobile text-on-surface">Expense Details</h2>
<span class="font-label-md text-label-md text-outline">Step 1 of 5</span>
</div>
<div class="flex gap-1">
<div class="w-8 h-1 bg-primary rounded-full"></div>
<div class="w-2 h-1 bg-surface-variant rounded-full"></div>
<div class="w-2 h-1 bg-surface-variant rounded-full"></div>
<div class="w-2 h-1 bg-surface-variant rounded-full"></div>
<div class="w-2 h-1 bg-surface-variant rounded-full"></div>
</div>
</div>
<div class="space-y-component-gap">
<!-- Expense Type (Trigger for Bottom Sheet) -->
<div class="flex flex-col gap-stack-gap relative">
<label class="font-label-md text-label-md text-on-surface-variant">Expense Type</label>
<button class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-left flex items-center justify-between focus:border-primary focus:outline-none transition-colors" id="expense-type-btn">
<span class="font-input-text text-input-text text-on-surface" id="selected-type-text">Select Category</span>
<span class="material-symbols-outlined text-outline-variant">expand_more</span>
</button>
</div>
<!-- Request Date -->
<div class="flex flex-col gap-stack-gap">
<label class="font-label-md text-label-md text-on-surface-variant">Request Date</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest font-input-text text-input-text text-on-surface focus:border-primary focus:outline-none transition-colors appearance-none" type="date" value="2024-05-15"/>
<span class="material-symbols-outlined text-outline-variant absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none">calendar_today</span>
</div>
</div>
<!-- Purpose -->
<div class="flex flex-col gap-stack-gap">
<label class="font-label-md text-label-md text-on-surface-variant">Purpose</label>
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest font-input-text text-input-text text-on-surface focus:border-primary focus:outline-none transition-colors placeholder-outline-variant" placeholder="e.g. Client Dinner" type="text"/>
</div>
<!-- Description -->
<div class="flex flex-col gap-stack-gap">
<label class="font-label-md text-label-md text-on-surface-variant">Description (Optional)</label>
<textarea class="w-full p-4 rounded-lg border border-outline-variant bg-surface-container-lowest font-input-text text-input-text text-on-surface focus:border-primary focus:outline-none transition-colors resize-none placeholder-outline-variant" placeholder="Add detailed notes here..." rows="4"></textarea>
</div>
</div>
</div>
<!-- Sticky Footer -->
<div class="fixed bottom-0 left-0 w-full px-margin-mobile py-4 pb-safe bg-surface-container-lowest/90 backdrop-blur-md border-t border-surface-variant">

      Continue to Amount
      <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
<!-- Spacer to prevent content from hiding behind sticky footer -->
<div class="h-24 pb-safe"></div>
<!-- Overlay (Hidden by default) -->
<div class="fixed inset-0 bg-inverse-surface/40 z-[60] opacity-0 pointer-events-none transition-opacity duration-300" id="backdrop"></div>
<!-- Bottom Sheet: Expense Type (Hidden by default) -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest rounded-t-2xl z-[70] transform translate-y-full transition-transform duration-300 ease-[cubic-bezier(0.2,0,0,1)] pb-safe shadow-[0_-4px_24px_rgba(0,0,0,0.08)]" id="bottom-sheet">
<div class="w-full flex justify-center pt-3 pb-1">
<div class="w-12 h-1 bg-outline-variant rounded-full"></div>
</div>
<div class="px-margin-mobile py-4">
<div class="flex items-center justify-between mb-4">
<h3 class="font-section-heading text-section-heading text-on-surface">Select Type</h3>
<button class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center" id="close-sheet-btn">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">close</span>
</button>
</div>
<div class="flex flex-col gap-2 max-h-[442px] overflow-y-auto pb-4">

<button class="category-option flex items-center gap-4 p-4 rounded-xl border border-surface-variant hover:border-primary hover:bg-surface-container transition-colors text-left" data-value="Travel">
<div class="w-10 h-10 rounded-full bg-tertiary-container text-on-tertiary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined">flight</span>
</div>
<div class="flex flex-col flex-1">
<span class="font-label-md text-label-md text-on-surface">Travel &amp; Transit</span>
<span class="font-metadata text-metadata text-on-surface-variant">Flights, trains, ride-shares</span>
</div>
</button>
<button class="category-option flex items-center gap-4 p-4 rounded-xl border border-surface-variant hover:border-primary hover:bg-surface-container transition-colors text-left" data-value="Meals">
<div class="w-10 h-10 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined">restaurant</span>
</div>
<div class="flex flex-col flex-1">
<span class="font-label-md text-label-md text-on-surface">Meals &amp; Entertainment</span>
<span class="font-metadata text-metadata text-on-surface-variant">Client dinners, team lunches</span>
</div>
</button>
<button class="category-option flex items-center gap-4 p-4 rounded-xl border border-surface-variant hover:border-primary hover:bg-surface-container transition-colors text-left" data-value="Office">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined">desk</span>
</div>
<div class="flex flex-col flex-1">
<span class="font-label-md text-label-md text-on-surface">Office Supplies</span>
<span class="font-metadata text-metadata text-on-surface-variant">Equipment, stationery, software</span>
</div>
</button>
</div>
</div>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('expense-type-btn');
    const sheet = document.getElementById('bottom-sheet');
    const backdrop = document.getElementById('backdrop');
    const closeBtn = document.getElementById('close-sheet-btn');
    const options = document.querySelectorAll('.category-option');
    const selectedText = document.getElementById('selected-type-text');

    const openSheet = () => {
      backdrop.classList.remove('opacity-0', 'pointer-events-none');
      backdrop.classList.add('opacity-100');
      sheet.classList.remove('translate-y-full');
      sheet.classList.add('translate-y-0');
    };

    const closeSheet = () => {
      backdrop.classList.remove('opacity-100');
      backdrop.classList.add('opacity-0', 'pointer-events-none');
      sheet.classList.remove('translate-y-0');
      sheet.classList.add('translate-y-full');
    };

    btn.addEventListener('click', openSheet);
    closeBtn.addEventListener('click', closeSheet);
    backdrop.addEventListener('click', closeSheet);

    options.forEach(opt => {
      opt.addEventListener('click', (e) => {
        const val = e.currentTarget.getAttribute('data-value');
        selectedText.textContent = val;
        selectedText.classList.remove('text-outline-variant');
        selectedText.classList.add('text-on-surface', 'font-medium');
        
        // Remove active state from all, add to current
        options.forEach(o => o.classList.remove('border-primary', 'bg-surface-container'));
        e.currentTarget.classList.add('border-primary', 'bg-surface-container');
        
        setTimeout(closeSheet, 150);
      });
    });
  });
</script></main></body></html>
