<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container shrink-0">

</div>

<script>
  // Simple interaction for the bottom sheet delight factor
  const trigger = document.getElementById('donor-trigger');
  const backdrop = document.getElementById('donor-sheet-backdrop');
  const sheet = document.getElementById('donor-sheet-content');
  const closeBtn = document.getElementById('close-donor-sheet');
  const options = document.querySelectorAll('.donor-option');
  const donorValue = document.getElementById('donor-value');
  const grantContainer = document.getElementById('grant-container');

  function openSheet() {
    backdrop.classList.remove('opacity-0', 'pointer-events-none');
    backdrop.classList.add('opacity-100', 'pointer-events-auto');
    sheet.classList.remove('translate-y-full');
  }

  function closeSheet() {
    backdrop.classList.add('opacity-0', 'pointer-events-none');
    backdrop.classList.remove('opacity-100', 'pointer-events-auto');
    sheet.classList.add('translate-y-full');
  }

  trigger.addEventListener('click', openSheet);
  closeBtn.addEventListener('click', closeSheet);
  backdrop.addEventListener('click', (e) => {
    if (e.target === backdrop) closeSheet();
  });

  options.forEach(opt => {
    opt.addEventListener('click', () => {
      // Uncheck all
      options.forEach(o => o.querySelector('span:last-child').classList.remove('text-primary', 'opacity-100'));
      options.forEach(o => o.querySelector('span:last-child').classList.add('opacity-0'));
      
      // Check selected
      const checkIcon = opt.querySelector('span:last-child');
      checkIcon.classList.remove('opacity-0');
      checkIcon.classList.add('text-primary', 'opacity-100');
      
      // Update UI
      donorValue.textContent = opt.dataset.name;
      donorValue.classList.add('font-semibold');
      
      // Unlock next field
      grantContainer.classList.remove('opacity-50', 'pointer-events-none');
      const grantText = grantContainer.querySelector('.font-input-text');
      grantText.textContent = "Select a grant...";
      grantText.classList.remove('text-on-surface-variant');
      grantText.classList.add('text-on-surface');
      const grantIcon = grantContainer.querySelector('span:last-child');
      grantIcon.textContent = "expand_more";
      
      setTimeout(closeSheet, 300);
    });
  });
</script></main></body></html>
