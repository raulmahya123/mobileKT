<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#f3faff] font-[Poppins] text-[#0f1d23]"><script>if(!localStorage.getItem('kaoemUser'))window.location.href='index.html';</script><header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-4 flex items-center gap-2"><button class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-[#e1f0f8]" onclick="window.location.href='new-expense-review.html'"><span class="material-symbols-outlined">arrow_back</span></button><h1 class="text-[22px] leading-7 font-semibold truncate flex-1">Approval Form</h1><span class="material-symbols-outlined text-[#006467]">send</span></div></header><main class="pt-20 pb-28 px-4 min-h-screen"><div class="flex items-center justify-between mb-2"><span class="text-[11px] uppercase text-[#3e4949]">Step 6 of 6</span><span class="text-[12px] font-medium text-[#006467]">Submit</span></div><div class="w-full h-1 bg-[#e1f0f8] rounded-full overflow-hidden mb-6"><div class="h-full bg-[#006467] rounded-full" style="width:100%"></div></div><section class="bg-white rounded-xl border border-[#bdc9c9]/60 p-5 text-center"><div class="w-14 h-14 rounded-full bg-[#006467] text-white flex items-center justify-center mx-auto mb-4"><span class="material-symbols-outlined text-[30px]">task_alt</span></div><h2 class="text-[22px] leading-7 font-semibold">Siap Dikirim</h2><p class="text-[14px] leading-5 text-[#3e4949] mt-2">Pengajuan akan masuk ke approval berjenjang sesuai orang yang sudah dipilih.</p></section><section class="mt-4 bg-white rounded-xl border border-[#bdc9c9]/60 p-4"><h3 class="text-[18px] leading-6 font-semibold mb-3">Urutan Approval</h3><div class="space-y-2" id="submit-flow"></div></section></main><div class="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-md px-4 py-4 flex gap-3"><button onclick="window.location.href='new-expense-review.html'" class="flex-1 h-12 rounded-lg bg-[#e1f0f8] font-medium">Back</button><button onclick="finishSubmit()" class="flex-[2] h-12 rounded-lg bg-[#006467] text-white font-medium">Submit Approval</button></div><script>const flow=JSON.parse(localStorage.getItem('kaoemApprovalFlow')||'{}');document.getElementById('submit-flow').innerHTML=[['1. Project Officer',flow.projectOfficer||'Rina Wulandari'],['2. Finance Officer',flow.financeOfficer||'Dewi Finance'],['3. Program Manager',flow.programManager||'Budi Santoso'],['4. Director',flow.director||'Nur Hidayat']].map(a=>`<div class="flex justify-between rounded-lg bg-[#e7f6fe] p-3 text-[14px]"><span>${a[0]}</span><b>${a[1]}</b></div>`).join('');function finishSubmit(){localStorage.setItem('kaoemExpenseStatus','Pending Approval');alert('Pengajuan berhasil dikirim ke approval berjenjang.');window.location.href='approval.html';}</script></body></html>
